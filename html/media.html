<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medial Elements</title>
  </head>
  <body>
    <!-- Image -->
    <img src="media/images/teddy.jpg" alt="This is teddy picture" />

    <!-- Audio -->
    <audio controls autoplay>
      <source src="media/music/folk_tales-vibe-good-vibes-566520.mp3" />
    </audio>
    <p>Good Vibes Music</p>
    <audio controls autoplay muted loop>
      <source
        src="media/music/folk_tales-vibe-good-vibes-566520.mp3"
        type="audio/mpeg"
      />
      <source
        src="media/music/folk_tales-vibe-good-vibes-566520.mp3"
        type="audio/wav"
      />
    </audio>

    <!-- Video -->
    <p>Baby Playing Video</p>
    <video controls autoplay muted loop>
      <source src="media/video/sample_video.mp4" type="video/mp4" />
      <!-- <source src="audio/sample_video.webm" type="video/webm" /> -->
    </video>
  </body>
</html>
